<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6C63FF">
<title>ITパスポート 勉強アプリ</title>
<style>
:root{
  --primary:#6C63FF;
  --primary-dark:#564fd8;
  --primary-light:#eeecff;
  --correct:#22c55e;
  --wrong:#ef4444;
  --bg:#f6f5fb;
  --card-bg:#ffffff;
  --text:#25233a;
  --text-sub:#6b6880;
  --border:#e5e3f2;
  --radius:16px;
  --radius-sm:12px;
  --shadow:0 4px 16px rgba(76,70,140,0.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Hiragino Sans",Meiryo,sans-serif;
  padding-bottom:32px;
  min-height:100vh;
}
#app{max-width:520px;margin:0 auto;padding:0 14px;}

header{
  padding:22px 4px 14px;
  text-align:center;
}
header h1{
  margin:0 0 4px;
  font-size:1.5rem;
  font-weight:800;
  color:var(--primary-dark);
  letter-spacing:0.02em;
}
header p{
  margin:0;
  font-size:0.82rem;
  color:var(--text-sub);
}

.stats-bar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:14px;
}
.stat-card{
  background:var(--card-bg);
  border-radius:var(--radius-sm);
  padding:10px 4px;
  text-align:center;
  box-shadow:var(--shadow);
}
.stat-card .num{
  font-size:1.25rem;
  font-weight:800;
  color:var(--primary-dark);
  line-height:1.1;
}
.stat-card.due .num{color:var(--wrong);}
.stat-card.mastered .num{color:var(--correct);}
.stat-card .label{
  font-size:0.62rem;
  color:var(--text-sub);
  margin-top:2px;
  white-space:nowrap;
}

.mode-tabs{
  display:flex;
  gap:6px;
  background:var(--card-bg);
  padding:5px;
  border-radius:14px;
  box-shadow:var(--shadow);
  margin-bottom:12px;
}
.mode-tab{
  flex:1;
  border:none;
  background:transparent;
  padding:10px 4px;
  border-radius:10px;
  font-size:0.76rem;
  font-weight:700;
  color:var(--text-sub);
  cursor:pointer;
  min-height:44px;
  transition:background .15s, color .15s;
}
.mode-tab.active{
  background:var(--primary);
  color:#fff;
}
.mode-tab .badge{
  display:inline-block;
  margin-left:3px;
  background:var(--wrong);
  color:#fff;
  border-radius:8px;
  font-size:0.6rem;
  padding:1px 5px;
  vertical-align:middle;
}
.mode-tab.active .badge{background:rgba(255,255,255,0.35);}

.cat-filter{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:2px 2px 12px;
  scrollbar-width:none;
}
.cat-filter::-webkit-scrollbar{display:none;}
.cat-chip{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:var(--card-bg);
  color:var(--text-sub);
  padding:7px 14px;
  border-radius:999px;
  font-size:0.74rem;
  font-weight:600;
  white-space:nowrap;
  cursor:pointer;
  min-height:32px;
}
.cat-chip.active{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
}

.progress-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
  font-size:0.76rem;
  color:var(--text-sub);
}
.progress-bar-track{
  flex:1;
  height:6px;
  background:var(--border);
  border-radius:999px;
  overflow:hidden;
}
.progress-bar-fill{
  height:100%;
  background:var(--primary);
  border-radius:999px;
  transition:width .25s;
}

/* ---- Flashcard ---- */
.flash-wrap{display:none;}
.flash-wrap.active{display:block;}
.flash-cat-tag{
  display:inline-block;
  font-size:0.68rem;
  font-weight:700;
  color:var(--primary-dark);
  background:var(--primary-light);
  padding:3px 10px;
  border-radius:999px;
  margin-bottom:10px;
}
.flashcard-scene{
  perspective:1200px;
  height:280px;
  margin-bottom:14px;
}
.flashcard{
  position:relative;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.4,.2,.2,1);
  cursor:pointer;
}
.flashcard.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;
  inset:0;
  border-radius:var(--radius);
  backface-visibility:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:26px;
  text-align:center;
  box-shadow:var(--shadow);
}
.face-front{
  background:linear-gradient(135deg,var(--primary) 0%, #8b7ffb 100%);
  color:#fff;
  font-size:1.05rem;
  font-weight:700;
  line-height:1.6;
}
.face-back{
  background:var(--card-bg);
  color:var(--text);
  transform:rotateY(180deg);
  font-size:0.95rem;
  line-height:1.7;
  border:1px solid var(--border);
}
.face-hint{
  position:absolute;
  bottom:10px;
  right:14px;
  font-size:0.62rem;
  opacity:.65;
}
.flash-controls{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}
.flash-controls button{
  flex:1;
  min-height:44px;
  border:none;
  border-radius:var(--radius-sm);
  background:var(--card-bg);
  box-shadow:var(--shadow);
  font-size:0.85rem;
  font-weight:700;
  color:var(--text);
  cursor:pointer;
}
.flash-controls button:active{transform:scale(.97);}
.srs-buttons{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}
.srs-buttons button{
  flex:1;
  min-height:48px;
  border:none;
  border-radius:var(--radius-sm);
  font-size:0.85rem;
  font-weight:800;
  cursor:pointer;
  color:#fff;
}
.srs-buttons .btn-no{background:var(--wrong);}
.srs-buttons .btn-yes{background:var(--correct);}
.srs-buttons button:active{transform:scale(.97);}
.srs-info{
  text-align:center;
  font-size:0.72rem;
  color:var(--text-sub);
  margin-bottom:4px;
}

/* ---- Quiz ---- */
.quiz-wrap{display:none;}
.quiz-wrap.active{display:block;}
.quiz-topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
.score-badges{display:flex;gap:6px;}
.score-badge{
  font-size:0.72rem;
  font-weight:700;
  padding:4px 10px;
  border-radius:999px;
}
.score-badge.correct{background:#dcfce7;color:#16a34a;}
.score-badge.wrong{background:#fee2e2;color:#dc2626;}
.q-cat-tag{
  font-size:0.68rem;
  font-weight:700;
  color:var(--primary-dark);
  background:var(--primary-light);
  padding:3px 10px;
  border-radius:999px;
}
.q-card{
  background:var(--card-bg);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
  margin-bottom:12px;
}
.q-text{
  font-size:1rem;
  font-weight:700;
  line-height:1.6;
  margin-bottom:16px;
}
.choice-btn{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  min-height:48px;
  text-align:left;
  border:1.5px solid var(--border);
  background:#fff;
  border-radius:var(--radius-sm);
  padding:10px 14px;
  margin-bottom:8px;
  font-size:0.86rem;
  color:var(--text);
  cursor:pointer;
  line-height:1.4;
}
.choice-btn:active{transform:scale(.99);}
.choice-btn .label{
  flex:0 0 auto;
  width:24px;
  height:24px;
  border-radius:50%;
  background:var(--primary-light);
  color:var(--primary-dark);
  font-size:0.72rem;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
}
.choice-btn.correct{border-color:var(--correct);background:#f0fdf4;}
.choice-btn.correct .label{background:var(--correct);color:#fff;}
.choice-btn.wrong{border-color:var(--wrong);background:#fef2f2;}
.choice-btn.wrong .label{background:var(--wrong);color:#fff;}
.choice-btn[disabled]{cursor:default;}

.explanation{
  background:var(--primary-light);
  border-radius:var(--radius-sm);
  padding:14px;
  font-size:0.82rem;
  line-height:1.6;
  color:var(--text);
  margin-bottom:14px;
  display:none;
}
.explanation.show{display:block;}
.explanation b{color:var(--primary-dark);}

.next-btn{
  display:none;
  width:100%;
  min-height:48px;
  border:none;
  border-radius:var(--radius-sm);
  background:var(--primary);
  color:#fff;
  font-size:0.92rem;
  font-weight:800;
  cursor:pointer;
  margin-bottom:16px;
}
.next-btn.show{display:block;}
.next-btn:active{transform:scale(.98);}

.result-screen{
  display:none;
  text-align:center;
  background:var(--card-bg);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:36px 20px;
}
.result-screen.show{display:block;}
.result-pct{
  font-size:2.6rem;
  font-weight:900;
  color:var(--primary-dark);
  margin-bottom:4px;
}
.result-msg{
  font-size:0.9rem;
  color:var(--text-sub);
  margin-bottom:20px;
}
.result-screen button{
  min-height:48px;
  padding:0 24px;
  border:none;
  border-radius:var(--radius-sm);
  background:var(--primary);
  color:#fff;
  font-size:0.9rem;
  font-weight:800;
  cursor:pointer;
}

/* ---- Review ---- */
.review-wrap{display:none;}
.review-wrap.active{display:block;}
.review-empty{
  text-align:center;
  background:var(--card-bg);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:40px 20px;
}
.review-empty .emoji{font-size:2.6rem;margin-bottom:10px;}
.review-empty h3{margin:0 0 6px;font-size:1.05rem;color:var(--primary-dark);}
.review-empty p{margin:0;font-size:0.82rem;color:var(--text-sub);line-height:1.6;}
.review-intro{
  font-size:0.78rem;
  color:var(--text-sub);
  margin-bottom:10px;
  line-height:1.6;
}
.review-intro b{color:var(--wrong);}

footer{
  text-align:center;
  margin-top:20px;
  padding-top:10px;
}
footer a{
  font-size:0.68rem;
  color:var(--text-sub);
  text-decoration:underline;
  cursor:pointer;
}

.hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>📘 ITパスポート 勉強アプリ</h1>
    <p>エビングハウスの忘却曲線にもとづいて復習タイミングをお知らせします</p>
  </header>

  <div class="stats-bar">
    <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">総問題数</div></div>
    <div class="stat-card due"><div class="num" id="statDue">0</div><div class="label">本日の復習</div></div>
    <div class="stat-card"><div class="num" id="statNew">0</div><div class="label">未学習</div></div>
    <div class="stat-card mastered"><div class="num" id="statMastered">0</div><div class="label">マスター済み</div></div>
  </div>

  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="flash">📇 カード</button>
    <button class="mode-tab" data-mode="quiz">✅ 4択</button>
    <button class="mode-tab" data-mode="review">🔁 復習<span class="badge" id="reviewBadge">0</span></button>
  </div>

  <div class="cat-filter" id="catFilter"></div>

  <!-- Flashcard -->
  <div class="flash-wrap active" id="flashWrap">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span class="flash-cat-tag" id="flashCat">-</span>
      <span style="font-size:0.72rem;color:var(--text-sub);" id="flashCount">0 / 0</span>
    </div>
    <div class="flashcard-scene">
      <div class="flashcard" id="flashcard">
        <div class="face face-front">
          <div id="flashQ">読み込み中...</div>
          <div class="face-hint">タップで裏返す</div>
        </div>
        <div class="face face-back">
          <div id="flashA"></div>
          <div class="face-hint">タップで表に戻す</div>
        </div>
      </div>
    </div>
    <div class="srs-info" id="flashSrsInfo"></div>
    <div class="srs-buttons">
      <button class="btn-no" id="btnFlashNo">❌ まだ覚えていない</button>
      <button class="btn-yes" id="btnFlashYes">✅ 覚えた</button>
    </div>
    <div class="flash-controls">
      <button id="btnFlashPrev">◀ 前へ</button>
      <button id="btnFlashShuffle">🔀 シャッフル</button>
      <button id="btnFlashNext">次へ ▶</button>
    </div>
  </div>

  <!-- Quiz -->
  <div class="quiz-wrap" id="quizWrap">
    <div class="quiz-topbar">
      <span class="q-cat-tag" id="quizCat">-</span>
      <div class="score-badges">
        <span class="score-badge correct" id="quizCorrectBadge">○ 0</span>
        <span class="score-badge wrong" id="quizWrongBadge">✕ 0</span>
      </div>
    </div>
    <div class="progress-row">
      <span id="quizProgressLabel">0 / 0</span>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="quizProgressFill" style="width:0%"></div></div>
    </div>
    <div class="q-card">
      <div class="q-text" id="quizQ">読み込み中...</div>
      <div id="quizChoices"></div>
    </div>
    <div class="explanation" id="quizExp"></div>
    <button class="next-btn" id="btnQuizNext">次の問題 ▶</button>

    <div class="result-screen" id="quizResult">
      <div class="result-pct" id="resultPct">0%</div>
      <div class="result-msg" id="resultMsg"></div>
      <button id="btnQuizRetry">もう一度挑戦する</button>
    </div>
  </div>

  <!-- Review -->
  <div class="review-wrap" id="reviewWrap">
    <div class="review-intro" id="reviewIntro"></div>
    <div id="reviewQuizArea"></div>
    <div class="review-empty" id="reviewEmpty">
      <div class="emoji">🎉</div>
      <h3>今日の復習はありません！</h3>
      <p>すべての問題が復習期限内です。<br>「カード」や「4択」で新しい問題に挑戦しましょう。</p>
    </div>
  </div>

  <footer>
    <a id="btnReset">学習データをリセットする</a>
  </footer>

</div>

<script>
/* ===================== 問題データ ===================== */
const ALL_QUESTIONS = [
/* ---- 経営戦略 ---- */
{cat:"経営戦略", q:"PDCAサイクルとは何か説明せよ", a:"Plan（計画）→Do（実行）→Check（評価）→Act（改善）を繰り返す、業務改善のための管理手法。", choices:["Plan→Do→Check→Actを繰り返す業務改善手法","予算編成のためのフレームワーク","組織図を作成する手法","在庫管理の手法"], correct:0, exp:"PDCAサイクルは計画・実行・評価・改善を継続的に回すことで業務品質を高める代表的なマネジメント手法。"},
{cat:"経営戦略", q:"SWOT分析で使われる4つの視点の組み合わせとして正しいものはどれか", a:"強み（Strength）・弱み（Weakness）・機会（Opportunity）・脅威（Threat）の4つ。", choices:["強み・弱み・機会・脅威","売上・利益・費用・資産","人材・物資・資金・情報","品質・コスト・納期・安全"], correct:0, exp:"SWOT分析は自社の内部環境（強み・弱み）と外部環境（機会・脅威）を整理して戦略を立てる手法。"},
{cat:"経営戦略", q:"「コアコンピタンス」とは何を指す用語か", a:"他社に真似できない、企業の中核となる強み・技術力のこと。", choices:["他社が模倣困難な自社の中核的な強み","経営陣の中核メンバー","主力製品のブランド名","本社機能を担う部署"], correct:0, exp:"コアコンピタンスは競合優位性の源泉となる、企業独自の技術やノウハウを指す。"},
{cat:"経営戦略", q:"特定の狭い市場に経営資源を集中させる戦略を何というか", a:"ニッチ戦略。大手が参入しにくい隙間市場に特化する戦略。", choices:["ニッチ戦略","コストリーダーシップ戦略","多角化戦略","垂直統合戦略"], correct:0, exp:"ニッチ戦略は特定の狭い市場セグメントに集中し、その分野で優位性を確立する戦略。"},
{cat:"経営戦略", q:"企業の合併・買収を意味する略語はどれか", a:"M&A（Mergers and Acquisitions）。", choices:["M&A","IPO","KPI","OEM"], correct:0, exp:"M&Aは合併（Mergers）と買収（Acquisitions）の総称で、他社の経営権取得などを指す。"},
{cat:"経営戦略", q:"財務・顧客・業務プロセス・学習と成長の4つの視点で経営を評価する手法は何か", a:"バランススコアカード（BSC）。", choices:["バランススコアカード","SWOT分析","ファイブフォース分析","バリューチェーン分析"], correct:0, exp:"バランススコアカードは4つの視点から経営目標の達成度をバランスよく評価するフレームワーク。"},
{cat:"経営戦略", q:"業界の競争構造を「新規参入の脅威」「代替品の脅威」など5つの要因で分析する手法は何か", a:"ファイブフォース分析（5F分析）。", choices:["ファイブフォース分析","SWOT分析","PPM分析","ABC分析"], correct:0, exp:"ファイブフォース分析はマイケル・ポーターが提唱した、業界の競争環境を5つの力で分析するフレームワーク。"},

/* ---- 法務 ---- */
{cat:"法務", q:"プログラムの著作権について正しいものはどれか", a:"プログラムはアイデアではなく表現（ソースコード）そのものが著作物として保護される。", choices:["ソースコードの具体的な表現が著作物として保護される","アルゴリズムのアイデア自体が保護される","登録しないと著作権は発生しない","著作権の保護期間は発行後10年間"], correct:0, exp:"著作権法ではプログラムの具体的な記述（表現）が保護対象で、アルゴリズムなどのアイデア自体は保護されない。"},
{cat:"法務", q:"個人情報保護法で「個人情報」に該当するものはどれか", a:"氏名や生年月日など、特定の個人を識別できる情報。", choices:["生存する個人を識別できる氏名や顔写真などの情報","法人の登記情報","匿名化され誰か特定できない統計データ","公開されている企業の売上高"], correct:0, exp:"個人情報保護法における個人情報とは、生存する個人を識別できる情報を指す。"},
{cat:"法務", q:"労働基準法で定められている法定労働時間は原則1日何時間、週何時間か", a:"1日8時間、週40時間が原則。", choices:["1日8時間・週40時間","1日6時間・週30時間","1日10時間・週50時間","1日7時間・週35時間"], correct:0, exp:"労働基準法では法定労働時間を原則1日8時間・週40時間と定めている。"},
{cat:"法務", q:"下請代金支払遅延等防止法（下請法）の目的として正しいものはどれか", a:"親事業者による下請事業者への不当な代金減額や支払遅延を防ぐこと。", choices:["親事業者から下請事業者への不当な取引を防止する","下請事業者間の価格カルテルを防止する","消費者を欺く表示を防止する","労働者の長時間労働を防止する"], correct:0, exp:"下請法は立場の弱い下請事業者を保護し、親事業者による代金減額・支払遅延などを規制する法律。"},

/* ===================== SRS（間隔反復）ロジック ===================== */
const SRS_KEY = "itpassport_srs_v1";
const INTERVAL_DAYS = [1, 2, 4, 7, 15, 30]; // box 0〜5 に対応する復習間隔（エビングハウスの忘却曲線を参考に設定）

function todayStr(offsetDays=0){
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return d.toISOString().slice(0,10);
}
function daysBetween(a,b){
  return Math.round((new Date(a) - new Date(b)) / 86400000);
}

let srsData = {};
function loadSRS(){
  try{
    srsData = JSON.parse(localStorage.getItem(SRS_KEY) || "{}");
  }catch(e){ srsData = {}; }
}
function saveSRS(){
  try{ localStorage.setItem(SRS_KEY, JSON.stringify(srsData)); }catch(e){}
}
function getEntry(id){
  return srsData[id] || {box:-1, next:null};
}
function isDue(id){
  const e = getEntry(id);
  if(e.box === -1) return true; // 未学習は常に復習対象
  return e.next <= todayStr();
}
function isMastered(id){
  return getEntry(id).box >= 5;
}
function isNew(id){
  return getEntry(id).box === -1;
}
function markResult(id, correct){
  let e = getEntry(id);
  if(correct){
    e.box = Math.min((e.box === -1 ? -1 : e.box) + 1, 5);
    if(e.box < 0) e.box = 0;
  } else {
    e.box = 0;
  }
  e.next = todayStr(INTERVAL_DAYS[e.box]);
  e.lastSeen = todayStr();
  srsData[id] = e;
  saveSRS();
}
function srsInfoText(id){
  const e = getEntry(id);
  if(e.box === -1) return "📝 まだ学習していません";
  if(e.box >= 5 && e.next > todayStr()) {
    const d = daysBetween(e.next, todayStr());
    return `🏆 マスター済み（次回復習まで${d}日）`;
  }
  if(e.next <= todayStr()) return "🔁 本日復習予定です";
  const d = daysBetween(e.next, todayStr());
  return `📅 次回復習まで${d}日（Box ${e.box+1}/6）`;
}

/* ===================== ユーティリティ ===================== */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function filteredByCat(cat){
  return cat === "すべて" ? ALL_QUESTIONS.slice() : ALL_QUESTIONS.filter(q => q.cat === cat);
}

  const mastered = ALL_QUESTIONS.filter(q => isMastered(q.id)).length;

}

/* ===================== 4択クイズ（共通ロジック） ===================== */
function buildQuizCard(q, containerId, onAnswer){
  const container = document.getElementById(containerId);
  const shuffledChoices = shuffle(q.choices.map((text, idx) => ({text, isCorrect: idx === q.correct})));
  let html = `
    <div class="q-card">
      <div class="q-text">${q.q}</div>
      <div id="${containerId}_choices"></div>
    </div>
    <div class="explanation" id="${containerId}_exp"><b>解説：</b>${q.exp}</div>
    <button class="next-btn" id="${containerId}_next">次の問題 ▶</button>
  `;
  container.innerHTML = html;
  const labels = ["A","B","C","D"];
  const choicesWrap = document.getElementById(`${containerId}_choices`);
  shuffledChoices.forEach((c, i) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = `<span class="label">${labels[i]}</span><span>${c.text}</span>`;
    btn.addEventListener("click", () => {
      if(btn.disabled) return;
      Array.from(choicesWrap.children).forEach((b, idx) => {
        b.disabled = true;
        if(shuffledChoices[idx].isCorrect) b.classList.add("correct");
      });
      if(!c.isCorrect) btn.classList.add("wrong");
      document.getElementById(`${containerId}_exp`).classList.add("show");
      document.getElementById(`${containerId}_next`).classList.add("show");
      onAnswer(c.isCorrect);
    });
    choicesWrap.appendChild(btn);
  });
  return document.getElementById(`${containerId}_next`);
}

/* ---- 4択クイズモード ---- */
function initQuiz(){
  quizList = shuffle(filteredByCat(currentCat));
  quizIndex = 0;
  quizCorrectCount = 0;
  quizWrongCount = 0;
  document.getElementById("quizResult").classList.remove("show");
  document.getElementById("quizWrap").querySelectorAll(".q-card, .explanation, .next-btn").forEach(el => {});
  renderQuiz();
}
function updateQuizTopbar(){
  document.getElementById("quizCorrectBadge").textContent = `○ ${quizCorrectCount}`;
  document.getElementById("quizWrongBadge").textContent = `✕ ${quizWrongCount}`;
  document.getElementById("quizProgressLabel").textContent = `${Math.min(quizIndex+1, quizList.length)} / ${quizList.length}`;
  const pct = quizList.length ? (quizIndex / quizList.length) * 100 : 0;
  document.getElementById("quizProgressFill").style.width = pct + "%";
}
function renderQuiz(){
  document.getElementById("quizResult").classList.remove("show");
  document.getElementById("quizQ").parentElement.style.display = "";
  const bodyArea = document.querySelector("#quizWrap");
  if(quizList.length === 0){
    document.getElementById("quizCat").textContent = currentCat;
    updateQuizTopbar();
    return;
  }
  if(quizIndex >= quizList.length){
    showQuizResult();
    return;
  }
  const q = quizList[quizIndex];
  document.getElementById("quizCat").textContent = q.cat;
  updateQuizTopbar();

  // 静的レイアウトを使い回す（初回のみ生成済みのためquiz用にはoriginal DOMを直接操作）
  document.getElementById("quizQ").textContent = q.q;
  const choicesWrap = document.getElementById("quizChoices");
  choicesWrap.innerHTML = "";
  document.getElementById("quizExp").classList.remove("show");
  document.getElementById("quizExp").innerHTML = `<b>解説：</b>${q.exp}`;
  document.getElementById("btnQuizNext").classList.remove("show");

  const labels = ["A","B","C","D"];
  const shuffledChoices = shuffle(q.choices.map((text, idx) => ({text, isCorrect: idx === q.correct})));
  quizAnswered = false;
  shuffledChoices.forEach((c, i) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = `<span class="label">${labels[i]}</span><span>${c.text}</span>`;
    btn.addEventListener("click", () => {
      if(quizAnswered) return;
      quizAnswered = true;
      Array.from(choicesWrap.children).forEach((b, idx) => {
        b.disabled = true;
        if(shuffledChoices[idx].isCorrect) b.classList.add("correct");
      });
      if(!c.isCorrect) btn.classList.add("wrong");
      if(c.isCorrect) quizCorrectCount++; else quizWrongCount++;
      markResult(q.id, c.isCorrect);
      updateStats();
      updateQuizTopbar();
      document.getElementById("quizExp").classList.add("show");
      document.getElementById("btnQuizNext").classList.add("show");
    });
    choicesWrap.appendChild(btn);
  });
}
document.getElementById("btnQuizNext").addEventListener("click", () => {
  quizIndex++;
  renderQuiz();
});
function showQuizResult(){
  document.getElementById("quizQ").parentElement.style.display = "none";
  document.getElementById("quizExp").classList.remove("show");
  document.getElementById("btnQuizNext").classList.remove("show");
  const total = quizCorrectCount + quizWrongCount;
  const pct = total ? Math.round((quizCorrectCount/total)*100) : 0;
  document.getElementById("resultPct").textContent = pct + "%";
  let msg = "";
  if(pct >= 90) msg = "🎉 素晴らしい！この調子で合格を目指しましょう";
  else if(pct >= 70) msg = "👍 いい調子です。間違えた問題は「復習」で再チェックしましょう";
  else msg = "💪 復習を重ねて定着させましょう。焦らず一問ずつ！";
  document.getElementById("resultMsg").textContent = `正解 ${quizCorrectCount} / ${total} 問　${msg}`;
  document.getElementById("quizResult").classList.add("show");
}
document.getElementById("btnQuizRetry").addEventListener("click", () => {
  initQuiz();
});

/* ---- 今日の復習モード（エビングハウスの忘却曲線に基づく出題） ---- */
function initReview(){
  const dueQs = filteredByCat(currentCat).filter(q => isDue(q.id));
  // 「未学習」より「復習期限が過ぎているもの」を優先し、超過日数が多い順に出題
  dueQs.sort((a,b) => {
    const ea = getEntry(a.id), eb = getEntry(b.id);
    const overdueA = ea.box === -1 ? 9999 : daysBetween(todayStr(), ea.next);
    const overdueB = eb.box === -1 ? 9999 : daysBetween(todayStr(), eb.next);
    return overdueB - overdueA;
  });
  reviewList = dueQs;
  reviewIndex = 0;
  reviewCorrectCount = 0;
  reviewWrongCount = 0;
  renderReview();
}
function renderReview(){
  const introEl = document.getElementById("reviewIntro");
  const emptyEl = document.getElementById("reviewEmpty");
  const areaEl = document.getElementById("reviewQuizArea");

  if(reviewList.length === 0){
    introEl.textContent = "";
    emptyEl.style.display = "block";
    areaEl.innerHTML = "";
    return;
  }
  emptyEl.style.display = "none";

  if(reviewIndex >= reviewList.length){
    const total = reviewCorrectCount + reviewWrongCount;
    const pct = total ? Math.round((reviewCorrectCount/total)*100) : 0;
    introEl.textContent = "";
    areaEl.innerHTML = `
      <div class="result-screen show">
        <div class="result-pct">${pct}%</div>
        <div class="result-msg">今日の復習が完了しました！（正解 ${reviewCorrectCount} / ${total} 問）<br>エビングハウスの忘却曲線に沿って、また明日以降お知らせします。</div>
        <button id="btnReviewDone">閉じる</button>
      </div>`;
    document.getElementById("btnReviewDone").addEventListener("click", () => {
      document.querySelector('.mode-tab[data-mode="flash"]').click();
    });
    return;
  }

  introEl.innerHTML = `本日復習すべき問題は <b>${reviewList.length}問</b> です。忘却曲線に沿って優先度の高い順に出題します。`;

  const q = reviewList[reviewIndex];
  areaEl.innerHTML = `
    <div class="quiz-topbar">
      <span class="q-cat-tag">${q.cat}</span>
      <div class="score-badges">
        <span class="score-badge correct">○ ${reviewCorrectCount}</span>
        <span class="score-badge wrong">✕ ${reviewWrongCount}</span>
      </div>
    </div>
    <div class="progress-row">
      <span>${reviewIndex+1} / ${reviewList.length}</span>
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${(reviewIndex/reviewList.length)*100}%"></div></div>
    </div>
    <div id="reviewCardArea"></div>
  `;

  const nextBtn = buildQuizCard(q, "reviewCardArea", (correct) => {
    if(correct) reviewCorrectCount++; else reviewWrongCount++;
    markResult(q.id, correct);
    updateStats();
  });
  nextBtn.addEventListener("click", () => {
    reviewIndex++;
    renderReview();
  });
}

/* ===================== リセット ===================== */
document.getElementById("btnReset").addEventListener("click", () => {
  if(confirm("学習履歴（復習スケジュール・進捗）をすべてリセットします。よろしいですか？")){
    srsData = {};
    saveSRS();
    updateStats();
    resetModeState();
  }
});

/* ===================== 初期化 ===================== */
renderCatFilter();
resetModeState();
